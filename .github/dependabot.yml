version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /lib/stash-js
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      stash-js:
        patterns:
          - "*"
    ignore:
      # typescript-eslint supports typescript below 6.1 only
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: cargo
    directory: /lib/stash-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      stash-rust:
        patterns:
          - "*"
    ignore:
      # 0.5 and 0.9 need reqwest 0.13, reqwest-eventsource 0.6 still needs reqwest 0.12
      - dependency-name: reqwest-middleware
        versions: [">=0.5"]
      - dependency-name: reqwest-retry
        versions: [">=0.8"]

  - package-ecosystem: gradle
    directory: /lib/stash-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      stash-java:
        patterns:
          - "*"
    ignore:
      # junit 6 requires java 17, the library targets java 11
      - dependency-name: org.junit:junit-bom
        versions: [">=6"]
