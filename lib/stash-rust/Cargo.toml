[package]
name = "stash"
version = "0.1.0"
edition = "2021"
authors = ["Umputun"]
description = "Rust client library for Stash key-value configuration service"
license = "MIT"
repository = "https://github.com/umputun/stash"
keywords = ["kv", "config", "client"]
categories = ["api-bindings", "config"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
zk = ["dep:argon2", "dep:aes-gcm", "dep:rand", "dep:zeroize", "dep:secrecy"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
reqwest-eventsource = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
argon2 = { version = "0.5", optional = true }
aes-gcm = { version = "0.10", optional = true }
zeroize = { version = "1.8", optional = true }
rand = { version = "0.8", optional = true }
secrecy = { version = "0.10", optional = true }
base64 = "0.22"
futures = "0.3"
urlencoding = "2.1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
