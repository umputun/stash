[package]
name = "stash"
version = "0.1.0"
edition = "2021"
authors = ["Eugene Umputun <umputun@gmail.com>"]
description = "Rust client library for Stash key-value configuration service"
license = "MIT"
repository = "https://github.com/umputun/stash"
keywords = ["stash", "kv", "config", "client"]
categories = ["api-bindings", "config"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
zk = ["dep:argon2", "dep:aes-gcm"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
rand = "0.8"
futures = "0.3"
async-stream = "0.3"
bytes = "1"

# optional dependencies for zk feature
argon2 = { version = "0.5", optional = true }
aes-gcm = { version = "0.10", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
